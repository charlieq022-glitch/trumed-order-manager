<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trumed - Login</title>
    <!-- Tailwind CSS per la grafica -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 id="formTitle" class="text-2xl font-bold text-slate-800 mb-6 text-center">Accedi a Trumed</h2>
        
        <form id="authForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <input type="email" id="email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
                Accedi
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            <span id="toggleText">Non hai un account?</span>
            <button onclick="toggleAuthMode()" id="btnToggle" class="text-blue-600 font-medium ml-1 hover:underline">Registrati</button>
        </div>
    </div>

    <!-- Script di gestione autenticazione -->
    <script type="module" src="auth.js"></script>
    <script type="module" src="login.js"></script>
</body>
</html>
